<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="sunGrad180" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3c6" />
      <stop offset="1" stop-color="#57e3b2" />
    </linearGradient>
  </defs>
  
  <!-- Gauge ring background -->
  <circle cx="90" cy="90" r="71" fill="none" stroke="rgba(124, 243, 198, 0.1)" stroke-width="3"/>
  
  <!-- Gauge arc (animated progress) -->
  <circle cx="90" cy="90" r="71" fill="none" stroke="url(#sunGrad180)" stroke-width="5.5" 
          stroke-dasharray="223 375" stroke-linecap="round"
          transform="rotate(-90 90 90)"/>
  
  <!-- Inner circle background for lightning -->
  <circle cx="90" cy="90" r="47" fill="rgba(124, 243, 198, 0.08)"/>
  
  <!-- Stylized lightning bolt -->
  <g fill="url(#sunGrad180)">
    <!-- Main lightning shape -->
    <path d="M 90 28 L 71 66 L 84 66 L 61 122 L 90 80 L 76 80 L 96 33 Z" stroke="none"/>
  </g>
  
  <!-- Inner ring detail -->
  <circle cx="90" cy="90" r="47" fill="none" stroke="rgba(124, 243, 198, 0.15)" stroke-width="1.4"/>
</svg>