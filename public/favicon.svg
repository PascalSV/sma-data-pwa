<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3c6" />
      <stop offset="1" stop-color="#57e3b2" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1a3a52" />
      <stop offset="1" stop-color="#0a0f1a" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Gauge ring background -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="rgba(124, 243, 198, 0.15)" stroke-width="1.5"/>
  
  <!-- Gauge arc -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#sunGrad)" stroke-width="2" 
          stroke-dasharray="78 130" stroke-linecap="round"
          transform="rotate(-90 32 32)"/>
  
  <!-- Inner circle background -->
  <circle cx="32" cy="32" r="16" fill="rgba(124, 243, 198, 0.08)"/>
  
  <!-- Stylized lightning bolt -->
  <g fill="url(#sunGrad)">
    <path d="M 32 12 L 24 23 L 29 23 L 20 42 L 32 28 L 27 28 L 34 15 Z" stroke="none"/>
  </g>
  
  <!-- Inner ring detail -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="rgba(124, 243, 198, 0.15)" stroke-width="0.8"/>
</svg>
</svg>
  </g>
  
  <!-- Upward trend indicator (small bars) -->
  <g fill="url(#sunGrad)" opacity="0.7">
    <rect x="26" y="38" width="2" height="4" rx="1"/>
    <rect x="30" y="36" width="2" height="6" rx="1"/>
    <rect x="34" y="34" width="2" height="8" rx="1"/>
  </g>
</svg>