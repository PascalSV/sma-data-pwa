<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sunGrad512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3c6" />
      <stop offset="1" stop-color="#57e3b2" />
    </linearGradient>
  </defs>
  
  <!-- Gauge ring background -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(124, 243, 198, 0.1)" stroke-width="8"/>
  
  <!-- Gauge arc (animated progress) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#sunGrad512)" stroke-width="16" 
          stroke-dasharray="630 1050" stroke-linecap="round"
          transform="rotate(-90 256 256)"/>
  
  <!-- Inner circle background for lightning -->
  <circle cx="256" cy="256" r="130" fill="rgba(124, 243, 198, 0.08)"/>
  
  <!-- Stylized lightning bolt -->
  <g fill="url(#sunGrad512)">
    <!-- Main lightning shape -->
    <path d="M 256 80 L 195 185 L 230 185 L 170 340 L 256 225 L 211 225 L 280 95 Z" stroke="none"/>
  </g>
  
  <!-- Inner ring detail -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(124, 243, 198, 0.15)" stroke-width="4"/>
</svg>