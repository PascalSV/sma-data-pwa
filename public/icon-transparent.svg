<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3c6" />
      <stop offset="1" stop-color="#57e3b2" />
    </linearGradient>
  </defs>
  
  <!-- Gauge ring background -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="rgba(124, 243, 198, 0.1)" stroke-width="3"/>
  
  <!-- Gauge arc (animated progress) -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="url(#sunGrad)" stroke-width="6" 
          stroke-dasharray="240 400" stroke-linecap="round"
          transform="rotate(-90 96 96)"/>
  
  <!-- Inner circle background for lightning -->
  <circle cx="96" cy="96" r="50" fill="rgba(124, 243, 198, 0.08)"/>
  
  <!-- Stylized lightning bolt -->
  <g fill="url(#sunGrad)">
    <!-- Main lightning shape -->
    <path d="M 96 30 L 75 70 L 90 70 L 65 130 L 96 85 L 81 85 L 102 35 Z" stroke="none"/>
  </g>
  
  <!-- Inner ring detail -->
  <circle cx="96" cy="96" r="50" fill="none" stroke="rgba(124, 243, 198, 0.15)" stroke-width="1.5"/>
</svg>
